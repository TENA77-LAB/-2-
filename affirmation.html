<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Аффирмация дня</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; touch-action: manipulation; }

    #screen {
      position: relative;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1.25rem, 5vw, 2.5rem);
      text-align: center;
      transition: background 0.65s ease;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    #screen:active { cursor: grabbing; }

    .stars {
      position: absolute;
      inset: -8%;
      width: 116%;
      height: 116%;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      animation: starfieldDrift 100s ease-in-out infinite alternate;
    }

    @keyframes starfieldDrift {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-2.5%, -1.2%, 0); }
    }

    .ripples {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .ripple {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(18vmin, 160px);
      height: min(18vmin, 160px);
      margin: 0;
      box-sizing: border-box;
      border: 1px solid rgba(236, 218, 168, 0.38);
      border-radius: 50%;
      box-shadow:
        0 0 0 1px rgba(212, 175, 55, 0.06),
        0 0 32px rgba(200, 180, 120, 0.1);
      animation: rippleExpand 6s cubic-bezier(0.18, 0.72, 0.28, 1) infinite;
    }

    .ripple:nth-child(1) { animation-delay: 0s; }
    .ripple:nth-child(2) { animation-delay: 1s; }
    .ripple:nth-child(3) { animation-delay: 2s; }
    .ripple:nth-child(4) { animation-delay: 3s; }
    .ripple:nth-child(5) { animation-delay: 4s; }
    .ripple:nth-child(6) { animation-delay: 5s; }

    @keyframes rippleExpand {
      0% {
        transform: translate(-50%, -50%) scale(0.08);
        opacity: 0;
      }
      8% {
        opacity: 0.42;
      }
      55% {
        opacity: 0.12;
      }
      100% {
        transform: translate(-50%, -50%) scale(16);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ripple {
        animation: none;
        opacity: 0;
      }
    }

    .star {
      --drift-x: 0px;
      --drift-y: 0px;
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 0 5px rgba(186, 230, 253, 0.65);
      animation-name: starAlive;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }

    @keyframes starAlive {
      0%, 100% {
        opacity: 0.18;
        transform: translate3d(0, 0, 0) scale(1);
        box-shadow: 0 0 4px rgba(186, 230, 253, 0.35);
      }
      28% {
        opacity: 1;
        transform: translate3d(var(--drift-x), var(--drift-y), 0) scale(1.48);
        box-shadow:
          0 0 10px rgba(224, 242, 254, 0.95),
          0 0 22px rgba(125, 211, 252, 0.45);
      }
      52% {
        opacity: 0.4;
        transform: translate3d(calc(var(--drift-x) * -0.55), calc(var(--drift-y) * -0.4), 0) scale(1.05);
        box-shadow: 0 0 6px rgba(186, 230, 253, 0.5);
      }
      72% {
        opacity: 0.92;
        transform: translate3d(calc(var(--drift-x) * 0.35), calc(var(--drift-y) * 0.65), 0) scale(1.28);
        box-shadow: 0 0 12px rgba(191, 219, 254, 0.75);
      }
    }

    .svg-defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.28rem, 1.2vw, 0.52rem);
    }

    .label-block .ornament,
    .center-block .ornament {
      width: 100%;
    }

    .hint-block .ornament--hint {
      width: auto;
      flex: 0 0 auto;
    }

    .ornament-glow {
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.28)) drop-shadow(0 0 10px rgba(212, 175, 55, 0.1));
    }

    .venzel {
      flex-shrink: 0;
      display: block;
    }

    .venzel path,
    .pillar-cap path {
      stroke-width: 1.18;
      vector-effect: non-scaling-stroke;
    }

    .ornament-gold-line {
      flex: 1 1 auto;
      min-width: 0.6rem;
      height: 1.5px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(140, 118, 55, 0.12) 12%,
        rgba(200, 172, 88, 0.45) 38%,
        rgba(255, 252, 238, 0.92) 50%,
        rgba(200, 172, 88, 0.45) 62%,
        rgba(140, 118, 55, 0.12) 88%,
        transparent 100%
      );
      box-shadow:
        0 0.5px 0 rgba(255, 253, 248, 0.42),
        0 0.5px 1px rgba(0, 0, 0, 0.08);
    }

    .ornament--subtle .ornament-gold-line {
      height: 1px;
      opacity: 0.92;
      box-shadow: 0 0.5px 0 rgba(255, 253, 248, 0.35);
    }

    .fleur {
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(255, 236, 180, 0.28));
    }

    .ornament--label-top {
      max-width: min(78vw, 300px);
      margin-bottom: 0.15rem;
    }

    .ornament--label-top .venzel {
      width: clamp(38px, 11vw, 50px);
      height: auto;
    }

    .ornament--label-bot {
      max-width: min(64vw, 240px);
      margin-top: 0.15rem;
    }

    .ornament--label-bot .venzel {
      width: clamp(32px, 9vw, 42px);
      height: auto;
    }

    .ornament--hero {
      max-width: min(94vw, 480px);
      margin-bottom: clamp(1.05rem, 2.8vw, 1.5rem);
    }

    .ornament--hero .venzel {
      width: clamp(44px, 13vw, 58px);
      height: auto;
    }

    .ornament--after {
      max-width: min(84vw, 400px);
      margin-top: clamp(1rem, 2.8vw, 1.45rem);
      margin-bottom: clamp(0.8rem, 2.2vw, 1.1rem);
    }

    .ornament--after .venzel {
      width: clamp(38px, 11vw, 50px);
      height: auto;
    }

    .ornament--hint {
      max-width: min(96vw, 420px);
      gap: clamp(0.4rem, 2vw, 0.75rem);
    }

    .ornament--hint .venzel {
      width: clamp(30px, 8.5vw, 40px);
      height: auto;
    }

    .ornament--hint .ornament-gold-line {
      min-width: 0.4rem;
      max-width: 2.75rem;
      flex: 0 1 2.75rem;
      height: 1px;
      opacity: 0.88;
    }

    .pillar {
      display: flex;
      flex-direction: column;
      align-items: center;
      align-self: stretch;
      width: clamp(16px, 4.5vw, 24px);
      flex-shrink: 0;
    }

    .pillar-cap {
      flex-shrink: 0;
      width: 100%;
      max-width: 22px;
      height: auto;
      opacity: 0.9;
    }

    .pillar-cap--flip {
      transform: rotate(180deg);
    }

    .pillar--mirror {
      transform: scaleX(-1);
    }

    .pillar-shaft {
      flex: 1 1 auto;
      width: 3px;
      min-height: 2.75em;
      margin: 2px 0;
      border-radius: 999px;
      background: linear-gradient(
        180deg,
        rgba(55, 44, 18, 0.2) 0%,
        rgba(160, 132, 58, 0.35) 18%,
        rgba(220, 190, 110, 0.55) 45%,
        rgba(255, 252, 242, 0.85) 50%,
        rgba(220, 190, 110, 0.55) 55%,
        rgba(160, 132, 58, 0.35) 82%,
        rgba(55, 44, 18, 0.2) 100%
      );
      box-shadow:
        inset 0.5px 0 0 rgba(255, 252, 245, 0.38),
        inset -0.5px 0 0 rgba(40, 32, 12, 0.18),
        0 0 8px rgba(212, 175, 55, 0.08);
    }

    .label-block {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
      z-index: 2;
    }

    .label {
      font: 500 clamp(0.82rem, 2.4vw, 1.05rem) / 1.25 system-ui, sans-serif;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #e8c547;
      text-shadow:
        0 0 22px rgba(212, 175, 55, 0.45),
        0 2px 4px rgba(15, 23, 42, 0.55);
    }

    .center-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      max-width: min(96vw, 520px);
    }

    .phrase-row {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: clamp(0.65rem, 2.5vw, 1.15rem);
      width: 100%;
    }

    #phrase {
      flex: 1 1 auto;
      font: 300 clamp(1.75rem, 7vw, 3rem) / 1.35 "Segoe UI", system-ui, sans-serif;
      color: #f5e6b8;
      text-shadow:
        0 1px 3px rgba(15, 23, 42, 0.55),
        0 2px 28px rgba(0, 0, 0, 0.28),
        0 0 48px rgba(212, 175, 55, 0.38);
      max-width: min(22ch, 100%);
      margin: 0;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    #phrase.fade {
      opacity: 0;
      transform: translateY(8px);
    }

    .tap-hint {
      max-width: min(36ch, 100%);
      font: 400 clamp(0.92rem, 2.8vw, 1.15rem) / 1.55 system-ui, sans-serif;
      color: #dfc56a;
      text-shadow:
        0 0 16px rgba(212, 175, 55, 0.32),
        0 2px 4px rgba(15, 23, 42, 0.5);
      letter-spacing: 0.03em;
    }

    .hint-block {
      position: fixed;
      bottom: max(1rem, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.35rem;
      z-index: 2;
      padding: 0 0.5rem;
    }

    .hint {
      font: 500 clamp(0.85rem, 2.5vw, 1.05rem) / 1.35 system-ui, sans-serif;
      letter-spacing: 0.06em;
      color: #dfc56a;
      text-shadow:
        0 0 14px rgba(212, 175, 55, 0.28),
        0 2px 4px rgba(15, 23, 42, 0.45);
      white-space: nowrap;
    }

    @media (max-width: 380px) {
      .hint {
        white-space: normal;
        text-align: center;
        max-width: 11rem;
      }
    }
  </style>
</head>

  <script>
    const affirmations = [
      "Тебе не нужно торопить свою жизнь",
      "Сегодня достаточно того, что ты есть",
      "Ты можешь отдыхать без чувства вины",
      "Медленно — тоже нормально",

      "Не нужно всем нравиться",
      "Ошибка — не приговор, а шаг",
      "У тебя уже больше сделано, чем кажется",
      "Мягкость к себе — не слабость",
      "Не всё должно быть решено сегодня",
      "Твоё тело заслуживает бережности",
      "Ты имеешь право на тишину",
      "Сравнивать себя с другими — необязательно",
      "Забота о себе — не эгоизм",
      "Ты можешь начать с малого",
      "Твои чувства — валидны",
      "Не обязательно быть продуктивным каждый день",
      "Не обязательно всё успевать",
      "Просить о помощи — нормально",
      "Ты можешь позволить себе спокойствие",
      "Один шаг вперёд — уже движение",
      "Ты можешь менять курс, когда захочешь",
      "Отдых — часть пути, а не помеха",
      "Твой темп — твой темп",
      "Сегодня можно просто дышать",
    ];

    const backgrounds = [
      "linear-gradient(165deg, #c8ecff 0%, #4a9fe8 42%, #0c1e3d 100%)",
      "linear-gradient(145deg, #b8e4ff 0%, #3b82f6 45%, #020617 100%)",
      "linear-gradient(155deg, #a5d8ff 0%, #2563eb 48%, #0a1628 100%)",
      "linear-gradient(160deg, #93c5fd 0%, #1d4ed8 50%, #020c1a 100%)",
      "linear-gradient(135deg, #bae6fd 0%, #0369a1 40%, #0c1929 100%)",
      "linear-gradient(170deg, #7dd3fc 0%, #0284c7 45%, #020617 100%)",
      "linear-gradient(150deg, #e0f2fe 0%, #38bdf8 38%, #0f172a 100%)",
      "linear-gradient(140deg, #cffafe 0%, #0ea5e9 42%, #082f49 100%)",
      "linear-gradient(158deg, #dbeafe 0%, #60a5fa 45%, #0f172a 100%)",
      "linear-gradient(145deg, #bfdbfe 0%, #2563eb 50%, #020617 100%)",
      "linear-gradient(165deg, #a5f3fc 0%, #0891b2 42%, #0c1e2e 100%)",
      "linear-gradient(152deg, #c4e8ff 0%, #1e40af 48%, #020617 100%)",
      "linear-gradient(138deg, #e0f2ff 0%, #3b82f6 40%, #0a1628 100%)",
      "linear-gradient(168deg, #9bd5ff 0%, #1e3a8a 52%, #020617 100%)",
      "linear-gradient(155deg, #b4e0ff 0%, #2563eb 44%, #0f172a 100%)",
      "linear-gradient(148deg, #d4f1ff 0%, #0ea5e9 46%, #082f49 100%)",
      "linear-gradient(162deg, #8ec5ff 0%, #1d4ed8 50%, #020c1a 100%)",
      "linear-gradient(142deg, #ecf6ff 0%, #60a5fa 42%, #0c1929 100%)",
      "linear-gradient(175deg, #7ec8ff 0%, #0369a1 48%, #020617 100%)",
      "linear-gradient(150deg, #c2e9ff 0%, #2563eb 45%, #0a1628 100%)",
      "linear-gradient(158deg, #a8dcff 0%, #1e40af 50%, #020617 100%)",
      "linear-gradient(145deg, #eef8ff 0%, #38bdf8 40%, #0f172a 100%)",
      "linear-gradient(160deg, #6eb6ff 0%, #1e3a8a 46%, #020c1a 100%)",
      "linear-gradient(152deg, #bfe6ff 0%, #0284c7 44%, #082f49 100%)",
      "linear-gradient(165deg, #9fd6ff 0%, #1d4ed8 48%, #020617 100%)",
    ];

    const starsEl = document.getElementById("stars");
    const starCount = 85;
    for (let s = 0; s < starCount; s++) {
      const star = document.createElement("span");
      star.className = "star";
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";
      const size = Math.random() * 2.2 + 0.45;
      star.style.width = size + "px";
      star.style.height = size + "px";
      star.style.animationDelay = Math.random() * 6 + "s";
      star.style.animationDuration = Math.random() * 4 + 2.8 + "s";
      const dx = (Math.random() * 10 - 5).toFixed(2);
      const dy = (Math.random() * 10 - 5).toFixed(2);
      star.style.setProperty("--drift-x", dx + "px");
      star.style.setProperty("--drift-y", dy + "px");
      starsEl.appendChild(star);
    }

    const screen = document.getElementById("screen");
    const phraseEl = document.getElementById("phrase");

    let i = 0;
    let transitionLock = false;
    let lastRandomAt = 0;

    function getRandomAffirmation(currentText) {
      const available = affirmations.filter((text) => text !== currentText);
      const list = available.length > 0 ? available : affirmations;
      return list[Math.floor(Math.random() * list.length)];
    }

    function showRandomAffirmation() {
      const now = Date.now();
      if (transitionLock || now - lastRandomAt < 280) return;
      lastRandomAt = now;
      transitionLock = true;
      const next = getRandomAffirmation(phraseEl.textContent);
      i = affirmations.indexOf(next);
      phraseEl.classList.add("fade");
      window.setTimeout(() => {
        phraseEl.textContent = next;
        screen.style.background = backgrounds[Math.floor(Math.random() * backgrounds.length)];
        phraseEl.classList.remove("fade");
        transitionLock = false;
      }, 180);
    }

    function applyIndex(n) {
      if (transitionLock) return;
      transitionLock = true;
      i = ((n % affirmations.length) + affirmations.length) % affirmations.length;
      phraseEl.classList.add("fade");
      window.setTimeout(() => {
        phraseEl.textContent = affirmations[i];
        screen.style.background = backgrounds[i % backgrounds.length];
        phraseEl.classList.remove("fade");
        transitionLock = false;
      }, 180);
    }

    applyIndex(0);

    const SWIPE = 48;
    let sx, sy, tracking;

    function start(x, y) {
      tracking = true;
      sx = x;
      sy = y;
    }
    function end(x, y) {
      if (!tracking) return;
      tracking = false;
      const dx = x - sx;
      const dy = y - sy;
      if (Math.abs(dx) < SWIPE && Math.abs(dy) < SWIPE) {
        showRandomAffirmation();
        return;
      }
      if (Math.abs(dx) >= Math.abs(dy)) {
        applyIndex(dx < 0 ? i + 1 : i - 1);
      } else {
        applyIndex(dy < 0 ? i + 1 : i - 1);
      }
    }

    screen.addEventListener("touchstart", (e) => {
      const t = e.changedTouches[0];
      start(t.clientX, t.clientY);
    }, { passive: true });
    screen.addEventListener("touchend", (e) => {
      const t = e.changedTouches[0];
      end(t.clientX, t.clientY);
    }, { passive: true });
    screen.addEventListener("touchcancel", () => {
      tracking = false;
    }, { passive: true });

    screen.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      start(e.clientX, e.clientY);
    });
    window.addEventListener("mouseup", (e) => {
      end(e.clientX, e.clientY);
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") applyIndex(i + 1);
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") applyIndex(i - 1);
    });
  </script>
</body>
</html>
